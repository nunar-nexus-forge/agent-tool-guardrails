[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-tool-guardrails"
version = "0.1.0"
description = "Typed policy rails for agent-tool calls: a policy compiler that turns declarative requirements into executable (Type, Predicate, Evidence, Action) rails, a tamper-evident evidence store, trust-scored governance, and an MCP proxy that enforces it all with zero code changes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "nunar-nexus-forge" }]
keywords = [
  "agent-tool-guardrails",
  "agent-guardrails",
  "guardrails", "policy", "governance", "compliance", "mcp", "model-context-protocol",
  "agents", "llm", "audit", "evidence", "gdpr", "hipaa", "trust",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[project.scripts]
typed-rails = "typed_rails.cli:main"

[project.urls]
Homepage = "https://github.com/nunar-nexus-forge/agent-tool-guardrails"
Documentation = "https://github.com/nunar-nexus-forge/agent-tool-guardrails/tree/main/docs"
Changelog = "https://github.com/nunar-nexus-forge/agent-tool-guardrails/blob/main/CHANGELOG.md"
Issues = "https://github.com/nunar-nexus-forge/agent-tool-guardrails/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
frameworks = ["langchain-core>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/typed_rails"]

[tool.hatch.build.targets.sdist]
include = ["src/typed_rails", "tests", "examples", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012", "SIM108", "B905", "RUF005", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
"examples/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
files = ["src/typed_rails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["typed_rails"]
